name: eval

# L1 (retrieval) is keyless and deterministic: it runs on every push and pull
# request. L2 (behavior) makes real model calls, so it runs only on a release
# tag or by hand. The repository is public: `pull_request` never receives
# repository secrets, and the behavior job is deliberately not attached to it.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval:
    name: retrieval (keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Retrieval regression
        run: npm run eval:retrieval
      - name: Summarize
        if: always()
        run: |
          if [ -f eval/report-retrieval.md ]; then
            cat eval/report-retrieval.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-retrieval
          path: |
            eval/report-retrieval.json
            eval/report-retrieval.md

  pipeline:
    name: pipeline (keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Digest to injection pipeline
        run: npm run eval:pipeline

  behavior:
    name: behavior (real model, tag or manual)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Two runs plus a harness checkout, install, and build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The suite fails every scenario when the key is missing, but the failure
      # would look like a product regression. Name the cause instead.
      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is empty; configure the repository secret."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."

      # The runtime is pinned to a harness commit, not the npm `dsh` package: the
      # published CLI failed every tool-calling session on the Linux runner with
      # "Cannot read properties of undefined (reading 'prepare')", while this
      # checkout path is the one the local runs exercise. Pinning the commit keeps
      # one tag comparable with the next.
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: f3803c96974ad4a94195fb97e5c637e9c2a3afe3
          path: harness
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          # The harness's own packageManager field; this repository has none.
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install the pinned harness
        working-directory: harness
        run: pnpm install --frozen-lockfile

      # Running the CLI from source still reads built `lib/` artifacts (the
      # typert host modules among them); without this every session exits at
      # load with "entry did not activate".
      - name: Build the harness artifacts
        working-directory: harness
        run: pnpm run build:artifacts

      - name: Behavior evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_REPO: ${{ github.workspace }}/harness
        run: npm run eval:behavior -- --control

      - name: Summarize
        if: always()
        run: |
          if [ -f eval/report-behavior.md ]; then
            cat eval/report-behavior.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-behavior
          path: |
            eval/report-behavior.json
            eval/report-behavior.md

  # A release is the only place the suite is trusted as a historical datapoint.
  # The baseline itself is updated deliberately, by hand, never by CI.
