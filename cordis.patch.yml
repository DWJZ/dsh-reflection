# dsh-reflection bundle 层：一个宿主插件行（浏览器半由 package.json 的 dsh.client 声明注入，
# 它把本插件写进 Session 日志的两类事件渲染成轨迹账本里的一行，因此这里不需要第二行）。
#
# 安装：用 plugin_manager 的 install_bundle 指向本目录（它负责写 profile 的
# package.json 与 cordis.patch.yml，不要手改）。
#
# 可在此行 config 下覆盖 contract §4 的任何字段，例如：
#       enabled: true
#       indexBudgetBytes: 6000
#       indexBudgetSplit: { user: 0.4, project: 0.6 }
- insert:
    - id: dsh-reflection
      name: dsh-reflection
